<style>
/* Layout: one-screen app — wordmark bar, one scrolling column (max 560px), fixed text tab bar.
   Young LA language: square edges, hairlines, uppercase Montserrat spaced 0.2em, monochrome + one orange. */
:root {
  --bg: #FFFFFF;
  --surface: #F4F4F4;
  --ink: #1C1C1C;
  --muted: #6E6E6E;
  --line: #DDDDDD;
  --accent: #ED8A00;
  --accent-ink: #1C1C1C;
  --accent-soft: rgba(237, 138, 0, .14);
  --btn: #1C1C1C;
  --btn-ink: #FFFFFF;
  --bad: #CB2B2B;
  --f-head: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Nunito Sans", "Helvetica Neue", Arial, sans-serif;
  --tabs-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E0E0E; --surface: #1A1A1A; --ink: #F2F2F2; --muted: #9B9B9B; --line: #2C2C2C;
    --accent-soft: rgba(237, 138, 0, .18); --btn: #F2F2F2; --btn-ink: #0E0E0E; --bad: #FF6B6B;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E0E0E; --surface: #1A1A1A; --ink: #F2F2F2; --muted: #9B9B9B; --line: #2C2C2C;
  --accent-soft: rgba(237, 138, 0, .18); --btn: #F2F2F2; --btn-ink: #0E0E0E; --bad: #FF6B6B;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
textarea { min-height: 72px; resize: vertical; }
.num { font-family: var(--f-head); font-weight: 600; font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 24px); }
body.notabs #app { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }

.brand { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 14px 16px; text-align: center; font: 600 12px/1 var(--f-head); letter-spacing: .38em; text-transform: uppercase; }
.brand small { display: block; margin-top: 6px; font: 500 9px/1 var(--f-head); letter-spacing: .3em; color: var(--muted); }

.eyebrow { font: 500 10.5px/1.3 var(--f-head); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--f-head); text-transform: uppercase; margin: 0; text-wrap: balance; }
h1 { font-weight: 600; font-size: 22px; letter-spacing: .2em; line-height: 1.2; }
h2 { font-weight: 600; font-size: 12px; letter-spacing: .2em; }
h3 { font-weight: 600; font-size: 13.5px; letter-spacing: .08em; line-height: 1.35; }
.vh { display: grid; gap: 6px; padding-block: 26px 18px; }
.section { display: grid; gap: 12px; margin-top: 30px; }
.section > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stack { display: grid; gap: 10px; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 22px 0; margin: 0; max-width: 40ch; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; background: var(--btn); color: var(--btn-ink); border: 1px solid var(--btn); font: 600 11.5px/1 var(--f-head); letter-spacing: .2em; text-transform: uppercase; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--line); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 10.5px; }
.btn.block { width: 100%; }
.btn:active { opacity: .8; }
.link { font: 600 10.5px/1 var(--f-head); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); padding: 10px 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* home */
.live { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; background: var(--btn); color: var(--btn-ink); }
.live .eyebrow { color: inherit; opacity: .7; }
.live strong { display: block; font: 600 15px/1.3 var(--f-head); text-transform: uppercase; letter-spacing: .08em; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); }

.list { display: grid; border-top: 1px solid var(--line); }

.item .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }

.wbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: 16px; }
.wbar .num { font-size: 17px; letter-spacing: .06em; }
.wname { border: 0; border-bottom: 1px solid var(--line); padding: 22px 0 10px; font: 600 20px/1.2 var(--f-head); letter-spacing: .14em; text-transform: uppercase; background: transparent; }
.ex { padding-block: 18px 6px; border-bottom: 1px solid var(--line); }
.ex.ss { border-left: 3px solid var(--accent); padding-left: 12px; }
.exh { display: flex; justify-content: space-between; gap: 10px; align-items: start; margin-bottom: 10px; }
.exh > div { display: grid; gap: 4px; }
.icon { width: 40px; height: 32px; font: 700 16px/1 var(--f-head); letter-spacing: .1em; color: var(--muted); }
.exnote, .snote { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-style: italic; }
.snote { padding-left: 48px; margin-top: -2px; }
.sets { display: grid; gap: 4px; }
.srow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 70px 58px 42px; gap: 6px; align-items: center; padding: 3px 0; }
.cardio .srow { grid-template-columns: 34px minmax(0, 1fr) 50px 50px 54px 42px; }
.srow.head { font: 500 9.5px/1 var(--f-head); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.srow.head span:nth-child(n+3) { text-align: center; }
.srow input { text-align: center; padding: 9px 4px; background: var(--surface); border-color: transparent; }
.srow input:focus { border-color: var(--ink); background: var(--bg); }
.srow input::placeholder { color: var(--muted); opacity: .75; font-weight: 500; }
.stype { height: 38px; font: 600 13px/1 var(--f-head); background: var(--surface); }
.t-w .stype { color: var(--accent); }
.t-d .stype, .t-f .stype { background: var(--ink); color: var(--bg); }
.prev { font: 500 12.5px/1.2 var(--f-head); color: var(--muted); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; height: 38px; font-variant-numeric: tabular-nums; }
.check { height: 38px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.check svg { width: 18px; height: 18px; }
.srow.done { background: var(--accent-soft); margin-inline: -6px; padding-inline: 6px; }
.srow.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.srow.done input { background: transparent; }
.addset { width: 100%; padding: 12px 0; font: 600 10.5px/1 var(--f-head); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

/* rest band — the one loud element */
#rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--btn); color: var(--btn-ink); padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
body:not(.notabs) #rest { bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: 14px; }
#rest .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); transform-origin: left; }
#rest .in { max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#rest .eyebrow { color: inherit; opacity: .65; }
#restT { font: 600 40px/1 var(--f-head); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
#rest .ctl { display: flex; gap: 6px; }
#rest .ctl button { min-width: 48px; height: 44px; border: 1px solid currentColor; font: 600 11px/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase; padding: 0 10px; opacity: .9; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 24; background: var(--bg); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabs-h); }
.tabs button { font: 600 9.5px/1 var(--f-head); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); position: relative; display: grid; place-items: center; align-content: center; gap: 6px; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: square; }
#mini { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); z-index: 24; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--accent); color: var(--accent-ink); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); font: 600 11px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; }
#miniL { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.hasmini #app { padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 70px); }
.hero { display: grid; gap: 12px; padding: 22px 18px 18px; background: var(--btn); color: var(--btn-ink); }
.hero .eyebrow { color: inherit; opacity: .65; }
.hero h2 { font-size: 26px; letter-spacing: .14em; line-height: 1.15; }
.hero p { margin: 0; font-size: 13.5px; opacity: .75; }
.hero .btn { min-height: 56px; font-size: 13px; margin-top: 4px; }
.coach { margin: 14px 0 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface); font-size: 13.5px; }
.btn.big { min-height: 58px; font-size: 13px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 30%; right: 30%; top: 0; height: 2px; background: var(--accent); }

/* history */
.month { display: flex; justify-content: space-between; padding: 22px 0 10px; border-bottom: 1px solid var(--ink); }
.hcard { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.hdate { display: grid; justify-items: start; gap: 4px; }
.hdate .num { font-size: 26px; line-height: 1; }
.hcard p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.hcard .meta { color: var(--ink); font-family: var(--f-head); font-weight: 500; font-size: 12px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font: 700 9.5px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; padding: 5px 7px; background: var(--accent); color: var(--accent-ink); }

/* detail */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); }
.stats div { padding: 14px 10px; display: grid; gap: 6px; border-left: 1px solid var(--line); min-width: 0; }
.stats div:first-child { border-left: 0; }
.stats .num { font-size: 17px; line-height: 1.1; overflow-wrap: anywhere; }
.dtable { display: grid; }
.drow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.drow .num { font-size: 14px; }
.drow .e1 { font: 500 11.5px/1 var(--f-head); color: var(--muted); display: flex; gap: 8px; align-items: center; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }

/* progress */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; padding: 9px 12px; border: 1px solid var(--line); font: 600 10px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.chart .ar { fill: var(--accent-soft); }

/* profile */

/* sheet + toast */
#sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .45); }

.plist { display: grid; border-top: 1px solid var(--line); max-height: 46vh; overflow-y: auto; }
.plist button { text-align: left; padding: 13px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
details summary { cursor: pointer; font: 600 10.5px/1 var(--f-head); letter-spacing: .2em; text-transform: uppercase; padding: 12px 0; }
details[open] { display: grid; gap: 10px; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); transform: translateX(-50%); z-index: 50; background: var(--btn); color: var(--btn-ink); padding: 12px 16px; font: 600 11px/1.3 var(--f-head); letter-spacing: .12em; text-transform: uppercase; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { #sheet .panel { animation: none; } }
</style>

/* ---------- units + format ---------- */
const unit = () => profile.unit;

function clock(ms, ceil) {
  const t = ceil ? Math.ceil(ms / 1000) : Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
const mins = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0'); };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };

/* ---------- training math ---------- */
const e1rm = (kg, reps) => !(reps > 0) ? 0 : reps === 1 ? kg : kg * (1 + reps / 30);   // Epley
const workSets = it => it.sets.filter(s => s.done && s.t !== 'w');
const volume = w => w.items.reduce((a, it) => isCardio(it.ex) ? a : a + workSets(it).reduce((b, s) => b + (s.kg || 0) * (s.reps || 0), 0), 0);
const setCount = w => w.items.reduce((a, it) => a + workSets(it).length, 0);
function lastSets(exId, skipId) {
  for (const w of saved()) {
    if (w.id === skipId) continue;
    const it = w.items.find(i => i.ex === exId);
    if (it && it.sets.length) return it.sets;
  }
  return [];
}
function prSets() {   // set ids that beat the exercise's previous best e1RM or heaviest weight
  const best = {}, prs = new Set();
  for (const w of saved().reverse()) for (const it of w.items) {
    if (isCardio(it.ex)) continue;
    const b = best[it.ex], cur = { e1: b?.e1 || 0, kg: b?.kg || 0 };
    for (const s of workSets(it)) {
      const kg = s.kg || 0, v = e1rm(kg, s.reps);
      if (b && kg > 0 && (v > b.e1 + 1e-6 || kg > b.kg + 1e-6)) prs.add(s.id);
      cur.e1 = Math.max(cur.e1, v); cur.kg = Math.max(cur.kg, kg);
    }
    best[it.ex] = cur;
  }
  return prs;
}
function usage() {
  const c = {};
  for (const w of saved()) for (const it of w.items) if (workSets(it).length) c[it.ex] = (c[it.ex] || 0) + 1;
  return c;
}
function exHistory(exId) {
  const out = [];
  for (const w of saved().reverse()) {
    const it = w.items.find(i => i.ex === exId); if (!it) continue;
    const ss = workSets(it); if (!ss.length) continue;
    const best = ss.reduce((a, s) => e1rm(s.kg || 0, s.reps) >= e1rm(a.kg || 0, a.reps) ? s : a, ss[0]);
    out.push({
      date: w.start, wid: w.id, best, sets: ss.length,
      e1rm: Math.max(...ss.map(s => e1rm(s.kg || 0, s.reps))), max: Math.max(...ss.map(s => s.kg || 0)),
      vol: ss.reduce((a, s) => a + (s.kg || 0) * (s.reps || 0), 0), reps: Math.max(...ss.map(s => s.reps || 0)),
      min: ss.reduce((a, s) => a + (s.min || 0), 0), km: ss.reduce((a, s) => a + (s.km || 0), 0), kcal: ss.reduce((a, s) => a + (s.kcal || 0), 0)
    });
  }
  return out;
}

/* ---------- persistence: localStorage always, account db when the viewer provides it ---------- */
const writers = {};
function push(path, getData) {   // one write at a time per doc; the latest data wins
  const w = writers[path] ||= { busy: false, again: false };
  if (w.busy) { w.again = true; return; }
  w.busy = true;
  remote.doc(path).set(clone(getData()))
    .catch(e => { if (e?.code === 'quota_exceeded') toast('Spazio dati esaurito: esporta un backup'); })
    .finally(() => { w.busy = false; if (w.again) { w.again = false; push(path, getData); } });
}
const wPath = id => base + '/profile/workouts/' + id;
function saveProfile() { profile.updatedAt = Date.now(); LS.set('profile', profile); if (remote) push(base + '/profile', () => profile); }
function saveWorkout(w) { w.updatedAt = Date.now(); workouts[w.id] = w; LS.set('workouts', workouts); if (remote) push(wPath(w.id), () => workouts[w.id]); }
let activeT;
function saveActive() {
  activeDoc.updatedAt = Date.now(); LS.set('active', activeDoc);
  if (!remote) return;
  clearTimeout(activeT); activeT = setTimeout(() => push(base + '/active', () => activeDoc), 1200);
}
async function connect() {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const id = db && user ? await user.id() : null;
  if (!id) return;
  remote = db; base = 'data/users/' + id;
  const err = () => {};
  let firstP = true, firstW = true, firstA = true;
  db.doc(base + '/profile').onSnapshot(s => {
    const r = s.exists ? s.data() : null;
    if (r && r.updatedAt > profile.updatedAt) { profile = { ...DEFAULT_PROFILE, ...clone(r) }; LS.set('profile', profile); softRender(); }
    else if (firstP && profile.updatedAt && (!r || r.updatedAt < profile.updatedAt)) push(base + '/profile', () => profile);
    firstP = false;
  }, err);
  db.collection(base + '/profile/workouts').onSnapshot(snap => {
    let changed = false; const seen = new Set();
    for (const d of snap.docs) {
      const r = d.data(); seen.add(d.id);
      if (!workouts[d.id] || r.updatedAt > workouts[d.id].updatedAt) { workouts[d.id] = clone(r); changed = true; }
      else if (firstW && r.updatedAt < workouts[d.id].updatedAt) push(wPath(d.id), () => workouts[d.id]);
    }
    if (firstW) for (const id of Object.keys(workouts)) if (!seen.has(id)) push(wPath(id), () => workouts[id]);
    firstW = false;
    if (changed) { LS.set('workouts', workouts); softRender(); }
  }, err);
  db.doc(base + '/active').onSnapshot(s => {
    const r = s.exists ? s.data() : null;
    if (r && r.updatedAt > activeDoc.updatedAt) { activeDoc = clone(r); LS.set('active', activeDoc); softRender(); }
    else if (firstA && activeDoc.updatedAt && (!r || r.updatedAt < activeDoc.updatedAt)) push(base + '/active', () => activeDoc);
    firstA = false;
  }, err);
  if (state.view === 'profile') render();
}

let actx;
function beep() {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, .22, .44].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.3, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + .18);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .2);
    });
  } catch {}
}

function nextRoutine() {   // rotation: the routine after the one done last
  const rs = profile.routines;
  if (!rs.length) return null;
  const last = saved().find(w => rs.some(r => r.id === w.routineId));
  return last ? rs[(rs.findIndex(r => r.id === last.routineId) + 1) % rs.length] : rs[0];
}

function setRow(it, s, i, j, p, cardio) {
  const keys = cardio ? ['min', 'km', 'kcal'] : ['kg', 'reps'];
  const prevTxt = !p ? '' : cardio ? [p.min && p.min + '′', p.km && nfInput(p.km) + ' km'].filter(Boolean).join(' ') : (p.reps ? `${fmtW(p.kg || 0)} × ${p.reps}` : '');
  const above = it.sets[j - 1];   // no history: suggest what was just typed in the set above
  const ph = k => p && p[k] != null ? (k === 'kg' ? fmtW(p.kg) : nfInput(p[k]))
    : above && above[k] != null ? (k === 'kg' ? fmtW(above.kg) : nfInput(above[k]))
    : (k === 'reps' && it.target ? parseInt(it.target) || '' : '');

function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}
function lineChart(pts, fmt) {
  if (pts.length < 2) return `<p class="empty">Il grafico compare dalla seconda sessione di questo esercizio.</p>`;
  const W = 340, H = 180, L = 40, R = 30, T = 18, B = 24;
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  if (lo === hi) { lo -= 1; hi += 1; }
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x;
  const sx = x => L + (x1 === x0 ? .5 : (x - x0) / (x1 - x0)) * (W - L - R), sy = y => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1)).join('');
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento, ultimo valore ${fmt(last.y)}">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${L - 6}" y="${sy(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`).join('')}
    <path class="ar" d="${line}L${sx(x1)},${H - B}L${sx(x0)},${H - B}Z"/>
    <path class="ln" d="${line}"/>
    ${pts.length <= 24 ? pts.slice(0, -1).map(p => `<circle class="pt" cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.5"/>`).join('') : ''}
    <circle class="end" cx="${sx(last.x)}" cy="${sy(last.y)}" r="4.5"/>
    <text class="endl" x="${Math.min(sx(last.x), W - 4)}" y="${sy(last.y) - 9}" text-anchor="end">${fmt(last.y)}</text>
    <text class="lbl" x="${L}" y="${H - 6}">${dShort.format(x0)}</text>
    <text class="lbl" x="${W - R}" y="${H - 6}" text-anchor="end">${dShort.format(x1)}</text>
  </svg>`;
}
function weekBars(list) {
  const W = 340, H = 120, L = 22, R = 4, T = 10, B = 22, n = 12, now = startOfWeek(Date.now());
  const weeks = Array.from({ length: n }, (_, i) => now - (n - 1 - i) * 7 * DAY);
  const counts = weeks.map(wk => list.filter(w => w.start >= wk && w.start < wk + 7 * DAY).length);
  const top = Math.max(3, ...counts), ticks = top <= 4 ? Array.from({ length: top + 1 }, (_, i) => i) : niceTicks(0, top, 3);
  const hi = ticks[ticks.length - 1], bw = (W - L - R) / n;
  const sy = y => T + (1 - y / hi) * (H - T - B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Allenamenti per settimana, ultime 12 settimane">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${L - 6}" y="${sy(t) + 3.5}" text-anchor="end">${t}</text>`).join('')}
    ${counts.map((c, i) => c ? `<rect class="bar ${i === n - 1 ? 'now' : ''}" x="${L + i * bw + 4}" y="${sy(c)}" width="${bw - 8}" height="${sy(0) - sy(c)}"/>` : '').join('')}
    <text class="lbl" x="${L + 4}" y="${H - 6}">${dShort.format(weeks[0])}</text>
    <text class="lbl" x="${W - R}" y="${H - 6}" text-anchor="end">Questa sett.</text>
  </svg>`;
}
function viewProgress() {

  if (!used.length) return html + `<p class="empty">Qui vedrai, per ogni esercizio, 1RM stimato, carico massimo, volume e record. Completa il primo allenamento per iniziare.</p>`;

    ${lineChart(pts, fmt)}

    ${hist.slice().reverse().slice(0, 12).map(h => `<button class="item" data-act="openDetail" data-id="${h.wid}" data-back="progress"><span class="grow"><span class="num" style="font-size:14px">${cardio ? h.min + ' min' + (h.km ? ' · ' + nfInput(h.km) + ' km' : '') : fmtW(h.best.kg || 0) + ' ' + unit() + ' × ' + h.best.reps}</span><p>${dShort.format(h.date)} · ${h.sets} serie</p></span>${cardio ? '' : `<span class="eyebrow">1RM ${fmt1(h.e1rm)}</span>`}</button>`).join('')}

/* ---------- workout actions ---------- */
const newSet = (t = 'n') => ({ id: uid(), t, done: false, note: '' });
const newItem = (exId, n = 3, target = '') => ({ id: uid(), ex: exId, ss: false, note: '', target, sets: Array.from({ length: n }, () => newSet()) });
function begin(name, routineId, items) {
  activeDoc = { updatedAt: 0, w: { id: uid(), name, routineId, start: Date.now(), end: null, note: '', items } };
  saveActive(); go('workout');
}
function getSet(el) { const it = activeDoc.w.items[+el.dataset.i]; return { it, s: it.sets[+el.dataset.j] }; }
function applyField(s, k, raw) { const v = parseNum(raw); s[k] = v == null || v < 0 ? null : k === 'kg' ? toKg(v) : v; }
function startRest(sec = profile.rest) { activeDoc.restEnd = Date.now() + sec * 1000; activeDoc.restTotal = sec; saveActive(); tick(); }
function tick() {
  const w = activeDoc.w, now = Date.now(), inW = state.view === 'workout';
  if (w && activeDoc.restEnd && activeDoc.restEnd <= now) {
    activeDoc.restEnd = null; saveActive();
    beep(); vib([220, 120, 220]); toast('Recupero finito · prossima serie');
  }
  const resting = !!(w && activeDoc.restEnd), left = resting ? activeDoc.restEnd - now : 0;
  const el = $('#elapsed'), lt = $('#liveT');
  if (w && !w.editing) { if (el) el.textContent = clock(now - w.start); if (lt) lt.textContent = clock(now - w.start); }
  const r = $('#rest');
  r.hidden = !(resting && inW);
  if (!r.hidden) {
    $('#restT').textContent = clock(left, true);
    $('#restBar').style.transform = `scaleX(${Math.max(0, left / (activeDoc.restTotal * 1000))})`;
  }
  // outside the editor a bar keeps the workout one tap away
  const m = $('#mini'), showM = !!w && !inW && state.view !== 'home' && !['routine', 'detail'].includes(state.view);
  m.hidden = !showM; document.body.classList.toggle('hasmini', showM);
  if (showM) {
    $('#miniL').textContent = (w.editing ? 'Modifica · ' : 'In corso · ') + w.name;
    $('#miniT').textContent = resting ? 'Recupero ' + clock(left, true) : w.editing ? '' : clock(now - w.start);
  }
}
setInterval(tick, 250);

function routineToItems(r) { return r.items.map(x => ({ ...newItem(x.ex, Math.max(1, x.sets | 0 || 1), x.reps || ''), ss: !!x.ss })); }
function addProgram(p) {
  for (const [name, list] of p.days) profile.routines.push({ id: uid(), name, items: list.map(([e, s, r]) => ({ ex: e, sets: s, reps: r, ss: false })) });
  saveProfile();
}

    const r = profile.routines.find(x => x.id === el.dataset.id); begin(r.name, r.id, routineToItems(r));
  },
  addProgram: el => { const p = PROGRAMS[+el.dataset.i]; addProgram(p); closeSheet(); render(); toast(p.name + ' aggiunto alle routine'); },
  pickProgram: el => { const p = PROGRAMS[+el.dataset.i]; addProgram(p); render(); toast('Pronto: si parte da ' + p.days[0][0]); },
  programs: () => openSheet(`<header style="display:flex;justify-content:space-between;align-items:center"><h2>Programmi pronti</h2><button class="link" data-act="closeSheet">Chiudi</button></header>
    <p class="muted" style="margin:0">Ogni giorno del programma diventa una routine che puoi modificare.</p>
    <div class="prog">${PROGRAMS.map((p, i) => `<button data-act="addProgram" data-i="${i}"><h3>${p.name}</h3><p>${p.note}</p><p>${p.days.map(d => d[0]).join(' · ')}</p><span class="plus">+ Aggiungi</span></button>`).join('')}</div>`),
  minimize: () => go('home'),
  newRoutine: () => go('routine', { routine: { id: uid(), name: '', items: [] } }),
  editRoutine: el => go('routine', { routine: clone(profile.routines.find(x => x.id === el.dataset.id)) }),
  saveRoutine: () => {
    const r = state.routine;
    if (!r.name.trim()) return toast('Dai un nome alla routine');
    if (!r.items.length) return toast('Aggiungi almeno un esercizio');
    const i = profile.routines.findIndex(x => x.id === r.id);
    i < 0 ? profile.routines.push(r) : profile.routines[i] = r;
    saveProfile(); go('home'); toast('Routine salvata');
  },
  rAdd: () => openPicker(id => { state.routine.items.push({ ex: id, sets: 3, reps: '8-12', ss: false }); render(); }),
  rDel: el => { state.routine.items.splice(+el.dataset.i, 1); render(); },
  rSS: el => { const it = state.routine.items[+el.dataset.i]; it.ss = !it.ss; render(); },
  rMove: el => { const a = state.routine.items, i = +el.dataset.i, j = i + +el.dataset.d; [a[i], a[j]] = [a[j], a[i]]; render(); },
  rRemove: () => openSheet(`<h2>Eliminare “${esc(state.routine.name)}”?</h2><p class="muted" style="margin:0">Gli allenamenti già fatti restano nello storico.</p>
    <div class="row2"><button class="btn ghost" data-act="closeSheet">Tieni</button><button class="btn danger" data-act="rRemoveYes">Elimina</button></div>`),
  rRemoveYes: () => { profile.routines = profile.routines.filter(x => x.id !== state.routine.id); saveProfile(); closeSheet(); go('home'); },

  addExercise: () => openPicker(id => { activeDoc.w.items.push(newItem(id, isCardio(id) ? 1 : 3)); saveActive(); render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0); }),
  addSet: el => {
    const it = activeDoc.w.items[+el.dataset.i], last = it.sets[it.sets.length - 1], s = newSet(last && last.t !== 'w' ? last.t : 'n');
    it.sets.push(s); saveActive(); render();
  },
  usePrev: el => {
    const { it, s } = getSet(el), p = lastSets(it.ex, activeDoc.w.id)[+el.dataset.j];
    if (!p) return;
    for (const k of ['kg', 'reps', 'min', 'km', 'kcal']) if (p[k] != null) s[k] = p[k];
    saveActive(); render();
  },
  toggleSet: el => {
    const { it, s } = getSet(el);
    if (!s.done) {
      el.closest('.srow').querySelectorAll('input').forEach(inp => { if (inp.value === '' && inp.placeholder !== '') applyField(s, inp.dataset.k, inp.placeholder); });
      const cardio = isCardio(it.ex);
      if (cardio ? !(s.min || s.km) : !(s.reps > 0)) return toast(cardio ? 'Inserisci minuti o km' : 'Inserisci le ripetizioni');
      s.done = true; vib(12);
      const i = +el.dataset.i, w = activeDoc.w;
      // in a superset rest only after the last exercise of the group
      if (!w.editing && !(it.ss && w.items[i + 1])) startRest();
    } else s.done = false;
    saveActive(); render();
  },
  restAdj: el => { if (!activeDoc.restEnd) return; activeDoc.restEnd += +el.dataset.d * 1000; activeDoc.restTotal = Math.max(activeDoc.restTotal + +el.dataset.d, 15); saveActive(); tick(); },
  restSkip: () => { activeDoc.restEnd = null; saveActive(); tick(); },
  setMenu: el => {
    const { s } = getSet(el), d = `data-i="${el.dataset.i}" data-j="${el.dataset.j}"`;
    const types = [['n', 'Normale', 'conta nel volume'], ['w', 'Riscaldamento', 'esclusa da volume e record'], ['d', 'Drop set', ''], ['f', 'Cedimento', '']];
    openSheet(`<h2>Serie</h2><div class="opts">${types.map(([t, n, sub]) => `<button data-act="setType" data-t="${t}" ${d} aria-pressed="${s.t === t}"><span>${n} ${sub ? `<small>· ${sub}</small>` : ''}</span></button>`).join('')}</div>
      <textarea id="setNote" data-field="setNote" ${d} placeholder="Nota sulla serie (tecnica, sensazioni)">${esc(s.note)}</textarea>
      <div class="row2"><button class="btn danger" data-act="delSet" ${d}>Elimina serie</button><button class="btn" data-act="closeSheet">Fatto</button></div>`, () => render());
  },
  setType: el => { getSet(el).s.t = el.dataset.t; saveActive(); $('#panel').querySelectorAll('[data-act="setType"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
  delSet: el => { const { it } = getSet(el); it.sets.splice(+el.dataset.j, 1); saveActive(); closeSheet(); },
  itemMenu: el => {
    const i = +el.dataset.i, w = activeDoc.w, it = w.items[i], d = `data-i="${i}"`, last = i === w.items.length - 1;
    openSheet(`<h2>${esc(ex(it.ex).name)}</h2>
      <textarea id="itemNote" data-field="itemNote" ${d} placeholder="Nota sull'esercizio (macchina, regolazioni)">${esc(it.note)}</textarea>
      <div class="opts">
        <button data-act="iSS" ${d} ${last ? 'disabled' : ''} aria-pressed="${it.ss}"><span>Superset col successivo ${last ? '<small>· serve un esercizio dopo</small>' : ''}</span></button>
        <button data-act="iMove" ${d} data-d="-1" ${i ? '' : 'disabled'}><span>Sposta su</span></button>
        <button data-act="iMove" ${d} data-d="1" ${last ? 'disabled' : ''}><span>Sposta giù</span></button>
        <button data-act="iSwap" ${d}><span>Sostituisci esercizio</span></button>
        <button data-act="iDel" ${d} style="color:var(--bad)"><span>Rimuovi esercizio</span></button>
      </div><button class="btn block" data-act="closeSheet">Fatto</button>`, () => render());
  },
  iSS: el => { const it = activeDoc.w.items[+el.dataset.i]; it.ss = !it.ss; saveActive(); closeSheet(); },
  iMove: el => { const a = activeDoc.w.items, i = +el.dataset.i, j = i + +el.dataset.d; [a[i], a[j]] = [a[j], a[i]]; saveActive(); closeSheet(); },
  iDel: el => { activeDoc.w.items.splice(+el.dataset.i, 1); saveActive(); closeSheet(); },
  iSwap: el => { const it = activeDoc.w.items[+el.dataset.i]; closeSheet(); openPicker(id => { it.ex = id; saveActive(); render(); }); },
  pg: el => { state.pick.g = el.dataset.g; renderPick(); },
  pick: el => { const cb = state.pick.cb; closeSheet(); cb(el.dataset.id); },
  createEx: () => {
    const name = $('#cname').value.trim(); if (!name) return toast("Scrivi il nome dell'esercizio");
    const e = { id: 'c-' + uid(), name, group: $('#cgroup').value };
    profile.custom.push(e); saveProfile(); const cb = state.pick.cb; closeSheet(); cb(e.id);
  },

  cancelWorkout: () => {
    const w = activeDoc.w;
    if (w.editing) { activeDoc = { updatedAt: 0, w: null }; saveActive(); return go('detail', { detail: w.id }); }
    openSheet(`<h2>Scartare l'allenamento?</h2><p class="muted" style="margin:0">Le serie segnate finora vanno perse.</p>
      <div class="row2"><button class="btn ghost" data-act="closeSheet">Continua</button><button class="btn danger" data-act="discardYes">Scarta</button></div>`);
  },
  discardYes: () => { activeDoc = { updatedAt: 0, w: null }; saveActive(); closeSheet(); go('home'); },
  finishWorkout: () => {
    const w = activeDoc.w, done = w.items.reduce((a, it) => a + it.sets.filter(s => s.done).length, 0);
    const open = w.items.reduce((a, it) => a + it.sets.filter(s => !s.done).length, 0);
    if (!done) return openSheet(`<h2>Nessuna serie segnata</h2><p class="muted" style="margin:0">Premi ✓ accanto a ogni serie fatta. Un allenamento senza serie non si salva.</p>
      <div class="row2"><button class="btn ghost" data-act="discardYes">Scarta</button><button class="btn" data-act="closeSheet">Continua</button></div>`);
    openSheet(`<h2>${w.editing ? 'Salvare le modifiche?' : 'Fine allenamento'}</h2>
      <p style="margin:0">${done} serie fatte${open ? ` · <span class="muted">${open} non segnate verranno tolte</span>` : ''}.</p>
      <div class="row2"><button class="btn ghost" data-act="closeSheet">Continua</button><button class="btn accent" data-act="finishYes">Salva</button></div>`);
  },
  finishYes: () => {
    const w = clone(activeDoc.w);
    w.items = w.items.map(it => ({ ...it, sets: it.sets.filter(s => s.done) })).filter(it => it.sets.length);
    if (!w.editing) w.end = Date.now();
    delete w.editing;
    saveWorkout(w); activeDoc = { updatedAt: 0, w: null }; saveActive(); closeSheet();
    go('detail', { detail: w.id, back: 'history' });
    const prs = prSets(), n = w.items.reduce((a, it) => a + it.sets.filter(s => prs.has(s.id)).length, 0);
    toast(n ? `Salvato · ${n} ${n === 1 ? 'record battuto' : 'record battuti'}` : 'Allenamento salvato');
  },

  openDetail: el => go('detail', { detail: el.dataset.id, back: el.dataset.back || 'history' }),
  repeat: el => {
    if (activeDoc.w) return toast('Hai già un allenamento in corso');
    const w = workouts[el.dataset.id];
    begin(w.name, w.routineId, w.items.map(it => ({ ...newItem(it.ex, it.sets.length, it.target || ''), ss: !!it.ss, note: it.note || '' })));
  },
  editWorkout: el => {
    if (activeDoc.w) return toast("Prima finisci l'allenamento in corso");
    activeDoc = { updatedAt: 0, w: { ...clone(workouts[el.dataset.id]), editing: true } }; saveActive(); go('workout');
  },
  saveAsRoutine: el => {
    const w = workouts[el.dataset.id];
    go('routine', { routine: { id: uid(), name: w.name, items: w.items.map(it => ({ ex: it.ex, sets: workSets(it).length || it.sets.length, reps: it.target || String(workSets(it)[0]?.reps || ''), ss: !!it.ss })) } });
  },
  deleteWorkout: el => openSheet(`<h2>Eliminare l'allenamento?</h2><p class="muted" style="margin:0">Sparisce dallo storico e dai grafici.</p>
    <div class="row2"><button class="btn ghost" data-act="closeSheet">Tieni</button><button class="btn danger" data-act="deleteYes" data-id="${el.dataset.id}">Elimina</button></div>`),
  deleteYes: el => { saveWorkout({ id: el.dataset.id, deleted: true }); closeSheet(); go('history'); toast('Allenamento eliminato'); },

  metric: el => { state.prog.metric = el.dataset.m; render(); },
  unit: el => { profile.unit = el.dataset.u; saveProfile(); render(); },
  addBody: () => {
    const v = parseNum($('#bwVal').value), date = $('#bwDate').value;
    if (!(v > 0) || !date) return toast('Inserisci peso e data');
    profile.body = profile.body.filter(b => b.date !== date).concat({ date, kg: toKg(v) }); saveProfile(); render(); toast('Peso registrato');
  },
  delBody: el => { profile.body = profile.body.filter(b => b.date !== el.dataset.d); saveProfile(); render(); },
  newCustom: () => openPicker(() => render()),
  delCustom: el => { profile.custom = profile.custom.filter(c => c.id !== el.dataset.id); saveProfile(); render(); },
  exportCsv: () => {
    const rows = [['data', 'allenamento', 'esercizio', 'gruppo', 'serie', 'tipo', 'kg', 'reps', '1rm_stimato', 'min', 'km', 'kcal', 'nota']];
    const T = { n: 'normale', w: 'riscaldamento', d: 'drop', f: 'cedimento' };
    for (const w of saved().reverse()) for (const it of w.items) it.sets.forEach((s, j) => rows.push([
      isoDay(w.start), w.name, ex(it.ex).name, ex(it.ex).group, j + 1, T[s.t], s.kg ?? '', s.reps ?? '', s.kg && s.reps ? (Math.round(e1rm(s.kg, s.reps) * 10) / 10) : '', s.min ?? '', s.km ?? '', s.kcal ?? '', s.note || '']));
    download('film-fit-allenamenti-' + isoDay(Date.now()) + '.csv', rows.map(r => r.map(c => /[",;\n]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\n'), 'text/csv');
  },
  exportJson: () => download('film-fit-backup-' + isoDay(Date.now()) + '.json', JSON.stringify({ app: 'film-fit-log', v: 1, profile, workouts }), 'application/json'),
  importJson: () => $('#imp').click()
};

async function download(filename, data, type) {
  const dl = await window.claude?.use?.('downloads').catch(() => null);
  if (dl) { try { await dl.save({ filename, data }); toast('File pronto'); } catch (e) { if (e?.code !== 'declined') toast('Download non riuscito, riprova'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#imp').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'film-fit-log' || typeof d.workouts !== 'object') throw 0;
    let n = 0;
    for (const w of Object.values(d.workouts)) if (w?.id && (!workouts[w.id] || (w.updatedAt || 0) > (workouts[w.id].updatedAt || 0))) { saveWorkout(w); n++; }
    if (d.profile) { profile = { ...DEFAULT_PROFILE, ...d.profile }; saveProfile(); }
    render(); toast(`Importati ${n} allenamenti`);
  } catch { toast('File non valido: scegli un backup esportato da questa app'); }
});

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && acts[el.dataset.act]) acts[el.dataset.act](el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.field; if (!f) return;
  const w = activeDoc.w;
  if (f === 'set') { applyField(w.items[+t.dataset.i].sets[+t.dataset.j], t.dataset.k, t.value); saveActive(); }
  else if (f === 'wname') { w.name = t.value; saveActive(); }
  else if (f === 'wnote') { w.note = t.value; saveActive(); }
  else if (f === 'setNote') { w.items[+t.dataset.i].sets[+t.dataset.j].note = t.value; saveActive(); }
  else if (f === 'itemNote') { w.items[+t.dataset.i].note = t.value; saveActive(); }
  else if (f === 'pq') { state.pick.q = t.value; renderPick(); }
  else if (f === 'rname') state.routine.name = t.value;
  else if (f === 'rsets') state.routine.items[+t.dataset.i].sets = Math.min(20, Math.max(1, parseInt(t.value) || 1));
  else if (f === 'rreps') state.routine.items[+t.dataset.i].reps = t.value;
});
document.addEventListener('change', e => {
  const f = e.target.dataset.field;
  if (f === 'progEx') { state.prog.ex = e.target.value; render(); }
  if (f === 'rest') { profile.rest = +e.target.value; saveProfile(); toast('Recupero: ' + clock(profile.rest * 1000)); }
});
// enter on a set input jumps to the next field
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset.field !== 'set') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('input[data-field="set"]')], i = all.indexOf(e.target);
  (all[i + 1] || e.target).focus();
});

if (activeDoc.w) state.view = 'workout';
render();
connect();
// installable build only (site/index.html carries the manifest link)
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>
